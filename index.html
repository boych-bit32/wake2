<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="叫醒他">
<title>叫醒他 · Wake Marcus</title>
<style>
  :root { --bg:#1a1420; --fg:#fff4f0; --accent:#ff5a5f; --accent2:#ff9a6b; --muted:#b8a9b6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #3a2236 0%, var(--bg) 70%);
    color:var(--fg);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    text-align:center; user-select:none;
  }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 48px; }
  button {
    width:220px; height:220px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(145deg, var(--accent2), var(--accent));
    color:#fff; font-size:34px; font-weight:700; letter-spacing:2px;
    box-shadow: 0 0 0 12px rgba(255,90,95,.15), 0 0 0 28px rgba(255,90,95,.07), 0 20px 40px rgba(0,0,0,.4);
    transition: transform .12s ease, filter .2s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  button span.en { font-size:14px; font-weight:500; letter-spacing:1px; opacity:.9; }
  button:active { transform:scale(.94); }
  button:disabled { filter:grayscale(.7) brightness(.8); cursor:default; }
  button.pulse { animation:pulse 1s ease-out 3; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,90,95,.6), 0 20px 40px rgba(0,0,0,.4); }
    100% { box-shadow:0 0 0 40px rgba(255,90,95,0), 0 20px 40px rgba(0,0,0,.4); }
  }
  #status { margin-top:44px; min-height:44px; font-size:16px; line-height:1.4; }
  .ok { color:#7ee0a1; } .err { color:#ffb4b4; }
</style>
</head>
<body>
  <h1>他又睡着了吗？😴</h1>
  <p class="sub">Fell asleep again? Tap to wake him up.</p>

  <button id="wake">⏰ 叫醒他<span class="en">WAKE UP</span></button>

  <div id="status"></div>

<script>
  const BARK_KEY = "eo7wsxnwpzq6VALhhN6AAL";
  const MESSAGE  = "醒醒";
  const URL_ = "https://api.day.app/" + BARK_KEY + "/" + encodeURIComponent(MESSAGE)
             + "?level=critical&call=1&volume=10&sound=horn";
  const COOLDOWN = 15; // seconds, so repeated taps don't stack alarms

  const btn = document.getElementById("wake");
  const status = document.getElementById("status");

  function show(text, cls) { status.className = cls || ""; status.textContent = text; }

  function cooldown() {
    let s = COOLDOWN;
    btn.disabled = true;
    const t = setInterval(() => {
      s--;
      if (s <= 0) { clearInterval(t); btn.disabled = false; }
    }, 1000);
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    show("发送中… Sending…");
    try {
      let sent = false;
      try {
        const r = await fetch(URL_);
        const j = await r.json();
        sent = j && j.code === 200;
      } catch (_) {
        // Fallback: fire the request even if the response can't be read
        await fetch(URL_, { mode: "no-cors" });
        sent = true;
      }
      if (sent) {
        show("✅ 已发送！他的手机正在响 📢\nSent! His phone is ringing.", "ok");
        btn.classList.remove("pulse"); void btn.offsetWidth; btn.classList.add("pulse");
        cooldown();
      } else {
        show("❌ 发送失败，请再试一次 Failed, try again", "err");
        btn.disabled = false;
      }
    } catch (e) {
      show("❌ 网络错误，请检查网络 Network error", "err");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
